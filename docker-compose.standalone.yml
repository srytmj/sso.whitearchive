name: sso-whitearchive

# Standalone: self-contained (tidak butuh network eksternal seperti Traefik), pakai
# Caddy sebagai reverse proxy. Satu file yang sama untuk dua skenario:
#
#   - Testing/pakai lokal:  CADDY_SITE_ADDRESS=http://localhost (default)  -> akses http://localhost
#   - Deploy publik:        CADDY_SITE_ADDRESS=sso.namadomain.com          -> Caddy otomatis provision
#                            HTTPS via Let's Encrypt, tidak perlu setup manual apa pun
#
# Pakai: docker compose -f docker-compose.standalone.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - sso_storage:/var/www/html/storage
      - sso_public:/var/www/html/public
    env_file: .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sso

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-http://localhost}
    volumes:
      - sso_public:/var/www/html/public:ro
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - sso

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: db_sso
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sso_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sso

volumes:
  sso_mysql_data:
  sso_storage:
  sso_public:
  caddy_data:
  caddy_config:

networks:
  sso:
    name: whitearchive_sso_standalone
